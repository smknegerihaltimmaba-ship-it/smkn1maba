<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS Dashboard - SMK N 1 Haltim</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <style> h1, h2, h3, .font-poppins { font-family: 'Poppins', sans-serif; } </style>
</head>
<body class="bg-slate-100 font-sans">
    
    <nav class="bg-slate-900 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="font-poppins font-bold text-xl cursor-pointer flex items-center gap-2" onclick="showMenu('dashboard')">
                <div class="w-8 h-8 bg-blue-600 rounded flex items-center justify-center text-sm">S</div>
                CMS Panel
            </div>
            <button onclick="logout()" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-lg text-sm font-semibold transition">Logout</button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-10">
        
        <!-- MENU UTAMA -->
        <div id="view-dashboard" class="block">
            <h1 class="text-3xl font-poppins font-bold mb-2">Dashboard Utama</h1>
            <p class="text-slate-600 mb-8 border-b pb-6">Kelola seluruh konten website dari panel ini.</p>
            
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <div onclick="showMenu('profil')" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 cursor-pointer hover:shadow-md hover:border-blue-400 transition">
                    <h2 class="text-lg font-bold text-slate-800">👤 Profil & Sambutan</h2>
                </div>
                <div onclick="showMenu('visimisi')" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 cursor-pointer hover:shadow-md hover:border-indigo-400 transition">
                    <h2 class="text-lg font-bold text-slate-800">🎯 Visi & Misi</h2>
                </div>
                <div onclick="showMenu('jurusan')" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 cursor-pointer hover:shadow-md hover:border-yellow-400 transition">
                    <h2 class="text-lg font-bold text-slate-800">🎓 Jurusan</h2>
                </div>
                <div onclick="showMenu('pengumuman')" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 cursor-pointer hover:shadow-md hover:border-orange-400 transition bg-orange-50/30">
                    <h2 class="text-lg font-bold text-orange-800">📢 Pengumuman</h2>
                </div>
                <div onclick="showMenu('galeri')" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 cursor-pointer hover:shadow-md hover:border-pink-400 transition bg-pink-50/30">
                    <h2 class="text-lg font-bold text-pink-800">🖼️ Galeri Foto</h2>
                </div>
                <div onclick="showMenu('kontak')" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 cursor-pointer hover:shadow-md hover:border-green-400 transition">
                    <h2 class="text-lg font-bold text-slate-800">📞 Kontak & Lokasi</h2>
                </div>
                <div onclick="showMenu('admin')" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 cursor-pointer hover:shadow-md hover:border-red-400 transition">
                    <h2 class="text-lg font-bold text-slate-800">🔐 Kelola Admin</h2>
                </div>
            </div>
        </div>

        <!-- CONTAINERS UNTUK SEMUA FORM (Disembunyikan secara default) -->
        <div id="view-profil" class="bg-white p-8 rounded-2xl shadow-sm border hidden">
            <div class="flex justify-between items-center border-b pb-4 mb-6"><h2 class="text-2xl font-poppins font-bold">Profil</h2><button onclick="showMenu('dashboard')" class="text-sm bg-slate-100 px-4 py-2 rounded-lg">Kembali</button></div>
            <form id="formProfil"><input type="text" id="inKepsek" class="w-full px-4 py-2 border rounded-lg mb-4" placeholder="Nama Kepsek" required><textarea id="inSambutan" rows="6" class="w-full px-4 py-2 border rounded-lg mb-4" required></textarea><button type="submit" id="btnProfil" class="bg-blue-600 text-white font-bold py-2 px-6 rounded-lg">Simpan</button></form>
        </div>

        <div id="view-visimisi" class="bg-white p-8 rounded-2xl shadow-sm border hidden">
            <div class="flex justify-between items-center border-b pb-4 mb-6"><h2 class="text-2xl font-poppins font-bold">Visi Misi</h2><button onclick="showMenu('dashboard')" class="text-sm bg-slate-100 px-4 py-2 rounded-lg">Kembali</button></div>
            <form id="formVM"><textarea id="inVisi" rows="4" class="w-full px-4 py-2 border rounded-lg mb-4" required></textarea><textarea id="inMisi" rows="6" class="w-full px-4 py-2 border rounded-lg mb-4" required></textarea><button type="submit" id="btnVM" class="bg-blue-600 text-white font-bold py-2 px-6 rounded-lg">Simpan</button></form>
        </div>

        <div id="view-kontak" class="bg-white p-8 rounded-2xl shadow-sm border hidden">
            <div class="flex justify-between items-center border-b pb-4 mb-6"><h2 class="text-2xl font-poppins font-bold">Kontak</h2><button onclick="showMenu('dashboard')" class="text-sm bg-slate-100 px-4 py-2 rounded-lg">Kembali</button></div>
            <form id="formKontak"><input type="text" id="inAlamat" class="w-full px-4 py-2 border rounded-lg mb-4" placeholder="Alamat"><input type="email" id="inEmail" class="w-full px-4 py-2 border rounded-lg mb-4" placeholder="Email"><input type="text" id="inTelepon" class="w-full px-4 py-2 border rounded-lg mb-4" placeholder="Telepon"><input type="text" id="inPeta" class="w-full px-4 py-2 border rounded-lg mb-4" placeholder="Link Embed Maps src="><button type="submit" id="btnKontak" class="bg-blue-600 text-white font-bold py-2 px-6 rounded-lg">Simpan</button></form>
        </div>

        <!-- MULTI-ITEM FORMS (Jurusan, Pengumuman, Galeri) -->
        <div id="view-jurusan" class="bg-white p-8 rounded-2xl shadow-sm border hidden">
            <div class="flex justify-between items-center border-b pb-4 mb-6"><h2 class="text-2xl font-poppins font-bold">Jurusan</h2><button onclick="showMenu('dashboard')" class="text-sm bg-slate-100 px-4 py-2 rounded-lg">Kembali</button></div>
            <form id="formJurusan">
                <div id="cont-in-jurusan"></div>
                <button type="button" onclick="addJurusanRow()" class="bg-slate-200 px-4 py-2 rounded text-sm font-semibold mb-6">+ Tambah Jurusan</button><br>
                <button type="submit" id="btnJurusan" class="bg-blue-600 text-white font-bold py-2 px-6 rounded-lg">Simpan Semua Jurusan</button>
            </form>
        </div>

        <div id="view-pengumuman" class="bg-white p-8 rounded-2xl shadow-sm border hidden">
            <div class="flex justify-between items-center border-b pb-4 mb-6"><h2 class="text-2xl font-poppins font-bold">Pengumuman</h2><button onclick="showMenu('dashboard')" class="text-sm bg-slate-100 px-4 py-2 rounded-lg">Kembali</button></div>
            <form id="formPengumuman">
                <div id="cont-in-pengumuman"></div>
                <button type="button" onclick="addPengumumanRow()" class="bg-slate-200 hover:bg-slate-300 px-4 py-2 rounded text-sm font-semibold mb-6 border border-slate-300">+ Tambah Pengumuman Baru</button><br>
                <button type="submit" id="btnPengumuman" class="bg-orange-600 hover:bg-orange-700 text-white font-bold py-2 px-6 rounded-lg">Simpan Semua Pengumuman</button>
            </form>
        </div>

        <div id="view-galeri" class="bg-white p-8 rounded-2xl shadow-sm border hidden">
            <div class="flex justify-between items-center border-b pb-4 mb-6"><h2 class="text-2xl font-poppins font-bold">Galeri Foto</h2><button onclick="showMenu('dashboard')" class="text-sm bg-slate-100 px-4 py-2 rounded-lg">Kembali</button></div>
            <form id="formGaleri">
                <div id="cont-in-galeri"></div>
                <button type="button" onclick="addGaleriRow()" class="bg-slate-200 hover:bg-slate-300 px-4 py-2 rounded text-sm font-semibold mb-6 border border-slate-300">+ Tambah Foto Baru</button><br>
                <button type="submit" id="btnGaleri" class="bg-pink-600 hover:bg-pink-700 text-white font-bold py-2 px-6 rounded-lg">Simpan Semua Galeri</button>
            </form>
        </div>

        <!-- ADMIN MANAGER -->
        <div id="view-admin" class="bg-white p-8 rounded-2xl shadow-sm border hidden">
            <div class="flex justify-between items-center border-b pb-4 mb-6"><h2 class="text-2xl font-poppins font-bold">Admin</h2><button onclick="showMenu('dashboard')" class="text-sm bg-slate-100 px-4 py-2 rounded-lg">Kembali</button></div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <form id="formAddAdmin" class="bg-slate-50 p-6 rounded-xl border"><h3 class="font-bold mb-4">Tambah Admin</h3><input type="text" id="newAdminUser" placeholder="Username" class="w-full px-3 py-2 border rounded mb-3" required><input type="text" id="newAdminPass" placeholder="Password" class="w-full px-3 py-2 border rounded mb-4" required><button type="submit" id="btnAddAdmin" class="w-full bg-slate-800 text-white font-bold py-2 rounded">Tambah</button></form>
                <div><h3 class="font-bold mb-4">Daftar Admin</h3><div id="list-admin" class="bg-white border rounded-xl overflow-hidden"></div></div>
            </div>
        </div>
    </main>

    <script>
        // ==========================================
        // GANTI DENGAN URL API BARU ANDA
        // ==========================================
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzS8XTKKd8hWxdZ0ms0r6DBfo4iXwazvuK9IN4JHPSMnTEPTRRU5revzjycJ1gD8KC6/exec'; 

        function showMenu(id) {
            ['dashboard', 'profil', 'visimisi', 'jurusan', 'pengumuman', 'galeri', 'kontak', 'admin'].forEach(m => document.getElementById('view-'+m).classList.add('hidden'));
            document.getElementById('view-'+id).classList.remove('hidden');
        }
        function logout() { window.location.replace('index.html'); }

        // Komponen Pembuat Baris Dinamis
        function addJurusanRow(singkatan='', nama='') {
            const div = document.createElement('div'); div.className = 'mb-4 p-4 border rounded-lg bg-slate-50 jurusan-item flex gap-4 items-end';
            div.innerHTML = `<div class="w-1/4"><label class="block text-xs mb-1">Singkatan</label><input type="text" class="i-singkatan w-full px-3 py-2 border rounded" value="${singkatan}" required></div><div class="w-3/4"><label class="block text-xs mb-1">Nama Jurusan</label><input type="text" class="i-nama w-full px-3 py-2 border rounded" value="${nama}" required></div><button type="button" onclick="this.parentElement.remove()" class="bg-red-100 text-red-600 px-3 py-2 rounded font-bold">X</button>`;
            document.getElementById('cont-in-jurusan').appendChild(div);
        }
        function addPengumumanRow(tgl='', jdl='', isi='') {
            const div = document.createElement('div'); div.className = 'mb-4 p-4 border border-orange-200 rounded-lg bg-orange-50/30 pengumuman-item relative';
            div.innerHTML = `<button type="button" onclick="this.parentElement.remove()" class="absolute top-4 right-4 bg-red-100 text-red-600 px-3 py-1 rounded text-xs font-bold">Hapus</button><div class="grid grid-cols-2 gap-4 mb-3"><div class="pr-12"><label class="block text-xs mb-1 font-semibold">Tanggal</label><input type="text" class="i-tgl w-full px-3 py-2 border rounded" value="${tgl}" placeholder="Contoh: 15 Juli 2026" required></div><div><label class="block text-xs mb-1 font-semibold">Judul Pengumuman</label><input type="text" class="i-judul w-full px-3 py-2 border rounded" value="${jdl}" required></div></div><div><label class="block text-xs mb-1 font-semibold">Isi Pengumuman</label><textarea class="i-isi w-full px-3 py-2 border rounded" rows="3" required>${isi}</textarea></div>`;
            document.getElementById('cont-in-pengumuman').appendChild(div);
        }
        function addGaleriRow(jdl='', link='') {
            const div = document.createElement('div'); div.className = 'mb-4 p-4 border border-pink-200 rounded-lg bg-pink-50/30 galeri-item flex gap-4 items-end';
            div.innerHTML = `<div class="w-1/3"><label class="block text-xs mb-1 font-semibold">Judul Foto</label><input type="text" class="i-judul w-full px-3 py-2 border rounded" value="${jdl}" required></div><div class="w-2/3"><label class="block text-xs mb-1 font-semibold">Link Gambar (URL Foto)</label><input type="text" class="i-link w-full px-3 py-2 border rounded" value="${link}" placeholder="https://..." required></div><button type="button" onclick="this.parentElement.remove()" class="bg-red-100 text-red-600 px-3 py-2 rounded font-bold">X</button>`;
            document.getElementById('cont-in-galeri').appendChild(div);
        }

        // Fetch Data
        function loadAllData() {
            fetch(scriptURL).then(res => res.json()).then(data => {
                if(data.status === 'success') {
                    document.getElementById('inKepsek').value = data.profil.namaKepsek || ''; document.getElementById('inSambutan').value = data.profil.sambutan || '';
                    document.getElementById('inVisi').value = data.visimisi.visi || ''; document.getElementById('inMisi').value = data.visimisi.misi || '';
                    document.getElementById('inAlamat').value = data.kontak.alamat || ''; document.getElementById('inEmail').value = data.kontak.email || ''; document.getElementById('inTelepon').value = data.kontak.telepon || ''; document.getElementById('inPeta').value = data.kontak.peta || '';
                    
                    document.getElementById('cont-in-jurusan').innerHTML = ''; data.jurusan.forEach(i => addJurusanRow(i.singkatan, i.nama));
                    document.getElementById('cont-in-pengumuman').innerHTML = ''; data.pengumuman.forEach(i => addPengumumanRow(i.tanggal, i.judul, i.isi));
                    document.getElementById('cont-in-galeri').innerHTML = ''; data.galeri.forEach(i => addGaleriRow(i.judul, i.link));
                    
                    document.getElementById('list-admin').innerHTML = data.users.map(u => `<div class="p-4 border-b flex justify-between items-center"><span class="font-medium">${u.username}</span> <button onclick="deleteUser('${u.username}')" class="text-xs text-red-500 border border-red-200 px-2 py-1 rounded">Hapus</button></div>`).join('');
                }
            });
        }
        document.addEventListener("DOMContentLoaded", loadAllData);

        // Submit Single Forms
        function submitForm(formId, btnId, actionName, payloadBuilder) {
            document.getElementById(formId).addEventListener('submit', function(e) {
                e.preventDefault(); const btn = document.getElementById(btnId); const txt = btn.innerHTML; btn.innerHTML = 'Menyimpan...'; btn.disabled = true;
                fetch(scriptURL, { method: 'POST', body: JSON.stringify(payloadBuilder()) }).then(res => res.json()).then(data => {
                    alert('Berhasil Disimpan!'); showMenu('dashboard'); btn.innerHTML = txt; btn.disabled = false; loadAllData();
                });
            });
        }
        submitForm('formProfil', 'btnProfil', 'updateProfil', () => ({ action: 'updateProfil', namaKepsek: document.getElementById('inKepsek').value, sambutan: document.getElementById('inSambutan').value }));
        submitForm('formVM', 'btnVM', 'updateVisiMisi', () => ({ action: 'updateVisiMisi', visi: document.getElementById('inVisi').value, misi: document.getElementById('inMisi').value }));
        submitForm('formKontak', 'btnKontak', 'updateKontak', () => ({ action: 'updateKontak', alamat: document.getElementById('inAlamat').value, email: document.getElementById('inEmail').value, telepon: document.getElementById('inTelepon').value, peta: document.getElementById('inPeta').value }));
        submitForm('formAddAdmin', 'btnAddAdmin', 'addUser', () => ({ action: 'addUser', username: document.getElementById('newAdminUser').value, password: document.getElementById('newAdminPass').value }));

        // Submit Multi Forms (List Data)
        function submitListForm(formId, btnId, action, itemSelector, mapper) {
            document.getElementById(formId).addEventListener('submit', function(e) {
                e.preventDefault(); const btn = document.getElementById(btnId); const txt = btn.innerHTML; btn.innerHTML = 'Menyimpan...'; btn.disabled = true;
                let arr = []; document.querySelectorAll(itemSelector).forEach(el => arr.push(mapper(el)));
                let payload = { action: action }; payload[action.replace('update', '').toLowerCase() + 'Data'] = arr;
                fetch(scriptURL, { method: 'POST', body: JSON.stringify(payload) }).then(res => res.json()).then(data => {
                    alert('Data Tersimpan!'); showMenu('dashboard'); btn.innerHTML = txt; btn.disabled = false;
                });
            });
        }
        submitListForm('formJurusan', 'btnJurusan', 'updateJurusan', '.jurusan-item', el => ({ singkatan: el.querySelector('.i-singkatan').value, nama: el.querySelector('.i-nama').value }));
        submitListForm('formPengumuman', 'btnPengumuman', 'updatePengumuman', '.pengumuman-item', el => ({ tanggal: el.querySelector('.i-tgl').value, judul: el.querySelector('.i-judul').value, isi: el.querySelector('.i-isi').value }));
        submitListForm('formGaleri', 'btnGaleri', 'updateGaleri', '.galeri-item', el => ({ judul: el.querySelector('.i-judul').value, link: el.querySelector('.i-link').value }));

        function deleteUser(u) { if(confirm(`Hapus admin ${u}?`)) fetch(scriptURL, { method: 'POST', body: JSON.stringify({ action: 'deleteUser', username: u }) }).then(res => res.json()).then(() => loadAllData()); }
    </script>
</body>
</html>
