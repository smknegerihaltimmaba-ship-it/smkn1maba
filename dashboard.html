<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - SMK N 1 Haltim</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans">
    <nav class="bg-blue-800 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <div class="font-bold text-xl flex items-center gap-2 cursor-pointer" onclick="showMenu('dashboard')">
                Admin Panel
            </div>
            <button onclick="logout()" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-lg text-sm font-semibold">Logout</button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        
        <!-- MENU UTAMA -->
        <div id="view-dashboard" class="bg-white p-8 rounded-xl shadow border border-slate-200 block">
            <h1 class="text-3xl font-bold mb-2">Selamat Datang, Administrator!</h1>
            <p class="text-slate-600 mb-8 border-b pb-6">Pilih menu di bawah ini.</p>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div onclick="showMenu('profil')" class="bg-blue-50 p-6 rounded-xl border border-blue-100 hover:shadow cursor-pointer">
                    <h2 class="text-xl font-bold text-blue-800 mb-2">Kelola Profil</h2>
                    <p class="text-sm">Ubah sambutan Kepala Sekolah.</p>
                </div>
            </div>
        </div>

        <!-- FORM KELOLA PROFIL -->
        <div id="view-profil" class="bg-white p-8 rounded-xl shadow border border-slate-200 hidden">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <h2 class="text-2xl font-bold">Kelola Profil Sekolah</h2>
                <button onclick="showMenu('dashboard')" class="text-slate-500 hover:text-slate-800">&larr; Kembali</button>
            </div>
            <form id="formProfil">
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-1">Nama Kepala Sekolah</label>
                    <input type="text" id="inputNamaKepsek" class="w-full px-4 py-2 border rounded-lg" required>
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-medium mb-1">Isi Sambutan</label>
                    <textarea id="inputSambutan" rows="6" class="w-full px-4 py-2 border rounded-lg" required></textarea>
                </div>
                <button type="submit" id="btnSimpan" class="bg-blue-700 hover:bg-blue-800 text-white font-bold py-2 px-6 rounded-lg">Simpan Perubahan</button>
            </form>
        </div>
    </main>

    <script>
        // ==========================================
        // GANTI DENGAN URL API BARU ANDA DI BAWAH INI
        // ==========================================
        const scriptURL = 'https://docs.google.com/spreadsheets/d/1IByjVkmb22RliWK9kHeILpWaO7fC2j7k7db3nO-P-Uo/edit?usp=drive_link'; 

        function showMenu(menuId) {
            document.getElementById('view-dashboard').classList.add('hidden');
            document.getElementById('view-profil').classList.add('hidden');
            document.getElementById('view-' + menuId).classList.remove('hidden');
        }

        function logout() { window.location.replace('index.html'); }

        // 1. Ambil data saat ini untuk diisi ke dalam Form
        document.addEventListener("DOMContentLoaded", function() {
            fetch(scriptURL)
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    document.getElementById('inputNamaKepsek').value = data.profil.namaKepsek;
                    document.getElementById('inputSambutan').value = data.profil.sambutan;
                }
            });
        });

        // 2. Kirim data baru ke Sheets saat tombol Simpan ditekan
        document.getElementById('formProfil').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSimpan');
            btn.innerHTML = 'Menyimpan...';
            btn.disabled = true;

            const namaBaru = document.getElementById('inputNamaKepsek').value;
            const sambutanBaru = document.getElementById('inputSambutan').value;

            fetch(scriptURL, {
                method: 'POST',
                body: JSON.stringify({ 
                    action: 'updateProfil', 
                    namaKepsek: namaBaru, 
                    sambutan: sambutanBaru 
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    alert('Berhasil! Teks di halaman beranda sudah diperbarui.');
                    showMenu('dashboard');
                } else {
                    alert('Gagal menyimpan data.');
                }
                btn.innerHTML = 'Simpan Perubahan';
                btn.disabled = false;
            })
            .catch(error => {
                alert('Terjadi kesalahan jaringan!');
                btn.innerHTML = 'Simpan Perubahan';
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>
