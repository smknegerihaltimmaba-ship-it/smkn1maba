<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - SMK N 1 Haltim</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans">
    <nav class="bg-blue-800 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="font-bold text-xl cursor-pointer" onclick="showMenu('dashboard')">Admin Panel</div>
            <button onclick="logout()" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-lg text-sm text-white font-semibold">Logout</button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-10">
        
        <!-- MENU UTAMA -->
        <div id="view-dashboard" class="bg-white p-8 rounded-xl shadow border block">
            <h1 class="text-3xl font-bold mb-2">Selamat Datang!</h1>
            <p class="text-slate-600 mb-8 border-b pb-6">Pilih menu di bawah ini.</p>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div onclick="showMenu('profil')" class="bg-blue-50 p-6 rounded-xl border border-blue-100 cursor-pointer hover:shadow">
                    <h2 class="text-xl font-bold text-blue-800">Kelola Profil</h2>
                    <p class="text-sm">Ubah nama Kepsek dan Sambutan.</p>
                </div>
                <div onclick="showMenu('jurusan')" class="bg-yellow-50 p-6 rounded-xl border border-yellow-100 cursor-pointer hover:shadow">
                    <h2 class="text-xl font-bold text-yellow-800">Kelola Jurusan</h2>
                    <p class="text-sm">Update nama Program Keahlian.</p>
                </div>
            </div>
        </div>

        <!-- FORM KELOLA PROFIL -->
        <div id="view-profil" class="bg-white p-8 rounded-xl shadow border hidden">
            <div class="flex justify-between border-b pb-4 mb-6">
                <h2 class="text-2xl font-bold">Kelola Profil</h2>
                <button onclick="showMenu('dashboard')" class="text-slate-500 hover:text-slate-800">&larr; Kembali</button>
            </div>
            <form id="formProfil">
                <div class="mb-4">
                    <label class="block font-medium mb-1">Nama Kepala Sekolah</label>
                    <input type="text" id="inputNamaKepsek" class="w-full px-4 py-2 border rounded-lg" required>
                </div>
                <div class="mb-6">
                    <label class="block font-medium mb-1">Isi Sambutan</label>
                    <textarea id="inputSambutan" rows="6" class="w-full px-4 py-2 border rounded-lg" required></textarea>
                </div>
                <button type="submit" id="btnSimpanProfil" class="bg-blue-700 text-white font-bold py-2 px-6 rounded-lg">Simpan Profil</button>
            </form>
        </div>

        <!-- FORM KELOLA JURUSAN -->
        <div id="view-jurusan" class="bg-white p-8 rounded-xl shadow border hidden">
            <div class="flex justify-between border-b pb-4 mb-6">
                <h2 class="text-2xl font-bold">Kelola Jurusan</h2>
                <button onclick="showMenu('dashboard')" class="text-slate-500 hover:text-slate-800">&larr; Kembali</button>
            </div>
            <form id="formJurusan">
                <div id="container-input-jurusan">
                    <p class="text-sm text-slate-500 mb-4">Memuat data jurusan...</p>
                </div>
                <button type="submit" id="btnSimpanJurusan" class="bg-yellow-600 hover:bg-yellow-700 text-white font-bold py-2 px-6 rounded-lg mt-4 hidden">Simpan Jurusan</button>
            </form>
        </div>
    </main>

    <script>
        // ==========================================
        // GANTI DENGAN URL API BARU ANDA
        // ==========================================
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwO-KSvWN81s52CJhNpxRv6c1j28NA-A-fRCGr87MDzjyzagtVgeNzfLFTPoyfrn3ZC/exec'; 

        function showMenu(id) {
            ['dashboard', 'profil', 'jurusan'].forEach(menu => document.getElementById('view-'+menu).classList.add('hidden'));
            document.getElementById('view-'+id).classList.remove('hidden');
        }
        function logout() { window.location.replace('index.html'); }

        // Fetch Data ke Form
        document.addEventListener("DOMContentLoaded", function() {
            fetch(scriptURL).then(res => res.json()).then(data => {
                if(data.status === 'success') {
                    // Profil
                    document.getElementById('inputNamaKepsek').value = data.profil.namaKepsek;
                    document.getElementById('inputSambutan').value = data.profil.sambutan;

                    // Jurusan
                    const contJurusan = document.getElementById('container-input-jurusan');
                    contJurusan.innerHTML = ''; 
                    data.jurusan.forEach((item, index) => {
                        contJurusan.innerHTML += `
                        <div class="mb-4 p-4 border rounded-lg bg-slate-50 jurusan-item">
                            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                                <div>
                                    <label class="block text-xs font-medium mb-1">Singkatan</label>
                                    <input type="text" class="input-singkatan w-full px-3 py-2 border rounded" value="${item.singkatan}" required>
                                </div>
                                <div class="md:col-span-3">
                                    <label class="block text-xs font-medium mb-1">Nama Program Keahlian</label>
                                    <input type="text" class="input-nama w-full px-3 py-2 border rounded" value="${item.nama}" required>
                                </div>
                            </div>
                        </div>`;
                    });
                    document.getElementById('btnSimpanJurusan').classList.remove('hidden');
                }
            });
        });

        // Submit Profil
        document.getElementById('formProfil').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSimpanProfil');
            btn.innerHTML = 'Menyimpan...'; btn.disabled = true;

            fetch(scriptURL, {
                method: 'POST',
                body: JSON.stringify({ 
                    action: 'updateProfil', 
                    namaKepsek: document.getElementById('inputNamaKepsek').value, 
                    sambutan: document.getElementById('inputSambutan').value 
                })
            }).then(res => res.json()).then(data => {
                alert('Profil Berhasil Diperbarui!'); showMenu('dashboard');
                btn.innerHTML = 'Simpan Profil'; btn.disabled = false;
            });
        });

        // Submit Jurusan
        document.getElementById('formJurusan').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSimpanJurusan');
            btn.innerHTML = 'Menyimpan...'; btn.disabled = true;

            let dataJurusan = [];
            document.querySelectorAll('.jurusan-item').forEach(el => {
                dataJurusan.push({
                    singkatan: el.querySelector('.input-singkatan').value,
                    nama: el.querySelector('.input-nama').value
                });
            });

            fetch(scriptURL, {
                method: 'POST',
                body: JSON.stringify({ action: 'updateJurusan', jurusanData: dataJurusan })
            }).then(res => res.json()).then(data => {
                alert('Jurusan Berhasil Diperbarui!'); showMenu('dashboard');
                btn.innerHTML = 'Simpan Jurusan'; btn.disabled = false;
            });
        });
    </script>
</body>
</html>
